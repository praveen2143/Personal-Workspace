<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Habit Tracker</title>
<style>
  :root{
    --ink:#16221f;
    --paper:#0f1715;
    --paper-raised:#15201d;
    --paper-card:#1a2622;
    --line: rgba(214,224,210,0.08);
    --amber:#d99a4e;
    --amber-soft: rgba(217,154,78,0.16);
    --moss:#7fae8a;
    --moss-soft: rgba(127,174,138,0.16);
    --rust:#c4694a;
    --text-hi:#f1ede2;
    --text-mid:#bcc6bd;
    --text-low:#74807a;
    --serif: 'Iowan Old Style','Palatino Linotype', Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    --mono: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    --radius: 10px;
  }
  [data-theme="light"]{
    --ink:#2b2620;
    --paper:#f3efe4;
    --paper-raised:#ffffff;
    --paper-card:#fbf9f2;
    --line: rgba(43,38,32,0.1);
    --text-hi:#241f1a;
    --text-mid:#5b5448;
    --text-low:#8c8475;
    --amber-soft: rgba(217,154,78,0.22);
    --moss-soft: rgba(95,140,107,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--text-hi);
    font-family:var(--sans);
    min-height:100vh;
    transition:background .3s ease,color .3s ease;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.025) 1px, transparent 0);
    background-size: 22px 22px;
    pointer-events:none;
    z-index:0;
  }
  [data-theme="light"] body::before{ background-image: radial-gradient(circle at 1px 1px, rgba(0,0,0,0.035) 1px, transparent 0); }

  .wrap{ max-width:1080px; margin:0 auto; padding:40px 28px 120px; position:relative; z-index:1;}

  /* ---------- header ---------- */
  header.top{
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:36px; gap:20px; flex-wrap:wrap;
  }
  .brand{ display:flex; flex-direction:column; gap:4px; }
  .brand .mark{ font-family:var(--serif); font-size:38px; font-weight:600; letter-spacing:.5px; color:var(--text-hi); }
  .brand .mark span{ color:var(--amber); font-style:italic; }
  .brand .sub{ font-family:var(--mono); font-size:11.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-low); }

  .top-actions{ display:flex; gap:10px; align-items:center; }
  .icon-btn{
    background:var(--paper-card); border:1px solid var(--line); color:var(--text-mid);
    width:38px;height:38px;border-radius:50%; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all .15s ease; font-size:16px;
  }
  .icon-btn:hover{ color:var(--text-hi); border-color:var(--amber); transform:translateY(-1px); }
  .icon-btn:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }

  /* ---------- stat strip (signature element) ---------- */
  .ledger-strip{
    display:grid; grid-template-columns:repeat(4,1fr);
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
    margin-bottom:32px; background:var(--paper-card);
  }
  .ledger-cell{
    padding:18px 20px; border-right:1px solid var(--line); position:relative;
  }
  .ledger-cell:last-child{ border-right:none; }
  .ledger-cell .num{ font-family:var(--serif); font-size:30px; font-weight:600; color:var(--text-hi); line-height:1; }
  .ledger-cell .lbl{ font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-low); margin-top:6px; display:block; }
  .ledger-cell.flame .num{ color:var(--amber); }
  .ledger-cell.moss .num{ color:var(--moss); }

  /* ---------- toolbar ---------- */
  .toolbar{ display:flex; gap:10px; align-items:center; margin-bottom:22px; flex-wrap:wrap; }
  .search{
    flex:1; min-width:160px; position:relative;
  }
  .search input{
    width:100%; background:var(--paper-card); border:1px solid var(--line); color:var(--text-hi);
    padding:10px 14px 10px 34px; border-radius:8px; font-family:var(--sans); font-size:13.5px;
  }
  .search::before{
    content:"⌕"; position:absolute; left:12px; top:50%; transform:translateY(-50%);
    color:var(--text-low); font-size:15px;
  }
  .filter-pills{ display:flex; gap:6px; flex-wrap:wrap; }
  .pill{
    padding:8px 14px; border-radius:20px; border:1px solid var(--line); background:transparent;
    color:var(--text-mid); font-size:12.5px; cursor:pointer; transition:all .15s; font-family:var(--sans);
    white-space:nowrap;
  }
  .pill.active{ background:var(--amber-soft); border-color:var(--amber); color:var(--text-hi); }
  .pill:hover{ border-color:var(--amber); }

  .add-btn{
    background:var(--amber); color:#1b140a; border:none; padding:10px 18px; border-radius:8px;
    font-weight:600; font-size:13.5px; cursor:pointer; display:flex; align-items:center; gap:6px;
    transition:transform .15s, box-shadow .15s; box-shadow:0 2px 0 rgba(0,0,0,0.15);
  }
  .add-btn:hover{ transform:translateY(-1px); box-shadow:0 4px 10px rgba(217,154,78,0.3); }
  .add-btn:active{ transform:translateY(0); }

  /* ---------- habit cards ---------- */
  .habits{ display:flex; flex-direction:column; gap:12px; }
  .habit{
    background:var(--paper-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; display:flex; flex-direction:column; gap:14px;
    transition:border-color .2s;
    animation:rise .35s ease both;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .habit:hover{ border-color:rgba(217,154,78,0.35); }
  .habit.archived{ opacity:.5; }

  .habit-row{ display:flex; align-items:center; gap:14px; }
  .habit-check{
    width:36px; height:36px; border-radius:50%; border:2px solid var(--line); flex:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px;
    transition:all .18s ease; background:transparent; color:transparent;
  }
  .habit-check:hover{ border-color:var(--moss); }
  .habit-check.done{ background:var(--moss); border-color:var(--moss); color:#0f1715; }
  .habit-check:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }

  .habit-info{ flex:1; min-width:0; }
  .habit-name{ font-size:15.5px; font-weight:600; color:var(--text-hi); display:flex; align-items:center; gap:8px; }
  .habit-tag{ font-size:10px; padding:2px 8px; border-radius:10px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.5px; }
  .habit-meta{ font-size:12px; color:var(--text-low); margin-top:2px; font-family:var(--mono); }

  .habit-streak{ display:flex; align-items:center; gap:5px; font-family:var(--serif); font-size:16px; color:var(--amber); flex:none; }
  .habit-streak .fire{ font-size:14px; }

  .drag-handle{ cursor:grab; color:var(--text-low); font-size:14px; padding:6px 2px; flex:none; touch-action:none; }
  .drag-handle:active{ cursor:grabbing; }
  .habit.dragging{ opacity:.4; }
  .habit.drag-over{ border-color:var(--amber); }

  .hm-cell[data-skip="1"]{ background:repeating-linear-gradient(45deg, var(--text-low) 0 2px, transparent 2px 5px); opacity:.6; }
  .hm-cell.has-note::after{ content:""; position:absolute; top:-2px; right:-2px; width:5px; height:5px; border-radius:50%; background:var(--amber); }

  .count-stepper{ display:flex; align-items:center; gap:6px; flex:none; }
  .count-stepper button{ width:24px;height:24px;border-radius:6px; border:1px solid var(--line); background:var(--paper-card); color:var(--text-hi); cursor:pointer; font-size:13px; line-height:1; }
  .count-stepper button:hover{ border-color:var(--amber); }
  .count-stepper .count-val{ font-family:var(--mono); font-size:13px; min-width:34px; text-align:center; color:var(--text-mid); }

  .sort-select{ background:var(--paper-card); border:1px solid var(--line); color:var(--text-mid); padding:8px 10px; border-radius:8px; font-size:12.5px; font-family:var(--sans); }

  .note-popover{
    position:absolute; background:var(--paper-raised); border:1px solid var(--line); border-radius:8px;
    padding:10px; width:220px; z-index:60; box-shadow:0 10px 30px rgba(0,0,0,0.35);
  }
  .note-popover textarea{
    width:100%; background:var(--paper-card); border:1px solid var(--line); color:var(--text-hi);
    border-radius:6px; padding:8px; font-size:12.5px; font-family:var(--sans); resize:none; height:60px;
  }
  .note-popover .row{ display:flex; justify-content:space-between; gap:6px; margin-top:8px; }
  .note-popover button{ font-size:11.5px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--text-mid); cursor:pointer; }
  .note-popover button.skip-btn.on{ background:var(--amber-soft); border-color:var(--amber); color:var(--text-hi); }

  #confettiCanvas{ position:fixed; inset:0; pointer-events:none; z-index:90; }

  .habit-controls{ display:flex; gap:4px; flex:none; }
  .mini-btn{
    background:transparent; border:none; color:var(--text-low); cursor:pointer; padding:6px;
    border-radius:6px; font-size:14px; transition:all .15s;
  }
  .mini-btn:hover{ background:var(--line); color:var(--text-hi); }

  /* heatmap */
  .heatmap{ display:flex; gap:3px; padding-left:50px; flex-wrap:wrap; }
  .hm-cell{
    width:13px; height:13px; border-radius:3px; background:var(--line); cursor:pointer; position:relative;
    transition:transform .1s;
  }
  .hm-cell:hover{ transform:scale(1.3); }
  .hm-cell[data-level="1"]{ background: var(--moss-soft); }
  .hm-cell[data-level="2"]{ background: rgba(127,174,138,0.55); }
  .hm-cell[data-level="3"]{ background: var(--moss); }
  .hm-cell.today{ box-shadow:0 0 0 1.5px var(--amber); }

  /* empty state */
  .empty{
    text-align:center; padding:70px 20px; color:var(--text-low);
  }
  .empty .glyph{ font-size:38px; margin-bottom:14px; opacity:.6; }
  .empty h3{ font-family:var(--serif); color:var(--text-hi); font-size:20px; margin:0 0 6px; }
  .empty p{ font-size:13.5px; max-width:340px; margin:0 auto; line-height:1.5; }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:50; opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .overlay.open{ opacity:1; pointer-events:all; }
  .modal{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; width:min(440px,92vw);
    padding:26px; transform:scale(.95) translateY(10px); transition:transform .2s ease;
    max-height:88vh; overflow-y:auto;
  }
  .overlay.open .modal{ transform:scale(1) translateY(0); }
  .modal h2{ font-family:var(--serif); margin:0 0 18px; font-size:21px; color:var(--text-hi); }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:1px; color:var(--text-low); margin-bottom:6px; font-family:var(--mono); }
  .field input[type=text], .field input[type=time], .field select{
    width:100%; background:var(--paper-card); border:1px solid var(--line); color:var(--text-hi);
    padding:10px 12px; border-radius:8px; font-size:14px; font-family:var(--sans);
  }
  .field input:focus, .field select:focus{ outline:2px solid var(--amber); outline-offset:1px; border-color:var(--amber); }
  .swatches{ display:flex; gap:8px; }
  .swatch{ width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .swatch.active{ border-color:var(--text-hi); }
  .freq-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .day-chip{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:transparent;
    color:var(--text-mid); cursor:pointer; font-size:11px; font-family:var(--mono);
  }
  .day-chip.on{ background:var(--amber-soft); border-color:var(--amber); color:var(--text-hi); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .btn-secondary{
    background:transparent; border:1px solid var(--line); color:var(--text-mid); padding:10px 16px;
    border-radius:8px; cursor:pointer; font-size:13.5px;
  }
  .btn-primary{
    background:var(--amber); border:none; color:#1b140a; padding:10px 18px; border-radius:8px;
    cursor:pointer; font-size:13.5px; font-weight:600;
  }

  /* premium detail view */
  .detail-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .detail-stats div{ background:var(--paper-card); border:1px solid var(--line); border-radius:8px; padding:10px; text-align:center; }
  .detail-stats .v{ font-family:var(--serif); font-size:19px; color:var(--text-hi); }
  .detail-stats .k{ font-size:9.5px; color:var(--text-low); text-transform:uppercase; letter-spacing:.6px; font-family:var(--mono); }

  footer.bottom{
    margin-top:50px; display:flex; justify-content:space-between; align-items:center;
    color:var(--text-low); font-size:11.5px; font-family:var(--mono); flex-wrap:wrap; gap:10px;
  }
  .data-actions{ display:flex; gap:14px; }
  .data-actions a, .data-actions button{
    background:none; border:none; color:var(--text-low); cursor:pointer; font-family:var(--mono); font-size:11.5px;
    text-decoration:underline; padding:0;
  }
  .data-actions a:hover, .data-actions button:hover{ color:var(--amber); }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--paper-raised); border:1px solid var(--amber); color:var(--text-hi);
    padding:12px 20px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none;
    transition:all .25s ease; z-index:80; box-shadow:0 8px 24px rgba(0,0,0,0.3);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:640px){
    .ledger-strip{ grid-template-columns:repeat(2,1fr); }
    .heatmap{ padding-left:0; }
    .habit-meta{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body data-theme="dark">
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="mark">The Daily <span>Ledger</span></div>
      <div class="sub">a quiet record of what you keep doing</div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle light/dark theme">◐</button>
      <button class="icon-btn" id="archiveToggle" title="Show archived" aria-label="Show archived habits">🗃</button>
    </div>
  </header>

  <section class="ledger-strip" id="ledgerStrip" aria-label="Overview stats"></section>

  <div class="toolbar">
    <div class="search">
      <input type="text" id="searchInput" placeholder="Find a habit…" aria-label="Search habits">
    </div>
    <div class="filter-pills" id="filterPills"></div>
    <button class="add-btn" id="openAdd">＋ New habit</button>
  </div>
  <div style="display:flex; justify-content:space-between; margin:-10px 0 16px; flex-wrap:wrap; gap:10px;">
    <select class="sort-select" id="sortSelect">
      <option value="manual">Sort: manual order</option>
      <option value="streak">Sort: by streak</option>
      <option value="name">Sort: by name</option>
      <option value="created">Sort: newest first</option>
    </select>
    <div class="view-toggle">
      <button class="pill active" id="viewWeeks" data-weeks="14">10 weeks</button>
      <button class="pill" id="viewMonths" data-weeks="26">6 months</button>
    </div>
  </div>

  <div class="habits" id="habitsList"></div>

</div>

<!-- Add/Edit Modal -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">New habit</h2>
    <div class="field">
      <label for="habitName">Name</label>
      <input type="text" id="habitName" placeholder="e.g. Read 10 pages" maxlength="60">
    </div>
    <div class="field">
      <label for="habitCategory">Category</label>
      <select id="habitCategory">
        <option value="health">Health</option>
        <option value="mind">Mind</option>
        <option value="work">Work</option>
        <option value="craft">Craft</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="field">
      <label>Color</label>
      <div class="swatches" id="colorSwatches"></div>
    </div>
    <div class="field">
      <label>Repeat on</label>
      <div class="freq-row" id="freqRow"></div>
    </div>
    <div class="field">
      <label for="habitReminder">Reminder (optional, browser notification)</label>
      <input type="time" id="habitReminder">
    </div>
    <div class="field">
      <label for="habitTarget">Target streak goal (days)</label>
      <input type="text" id="habitTarget" placeholder="e.g. 21" inputmode="numeric">
    </div>
    <div class="field">
      <label for="habitCountTarget">Track as a count? (optional — e.g. 8 for "8 glasses of water"). Leave blank for simple done/not-done.</label>
      <input type="text" id="habitCountTarget" placeholder="e.g. 8" inputmode="numeric">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelModal">Cancel</button>
      <button class="btn-primary" id="saveHabit">Save habit</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="overlay" id="detailOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <h2 id="detailTitle">Habit</h2>
    <div class="detail-stats" id="detailStats"></div>
    <div class="heatmap" id="detailHeatmap" style="padding-left:0; margin-bottom:18px;"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="archiveHabitBtn">Archive</button>
      <button class="btn-secondary" id="deleteHabitBtn" style="color:#c4694a;border-color:#c4694a;">Delete</button>
      <button class="btn-primary" id="closeDetail">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<canvas id="confettiCanvas"></canvas>

<script>
(function(){
  "use strict";

  /* ---------------- storage ---------------- */
  const STORE_KEY = "ledger_habits_v1";
  const THEME_KEY = "ledger_theme_v1";
  const DAY_NAMES = ["S","M","T","W","T","F","S"];
  const COLORS = ["#d99a4e","#7fae8a","#c4694a","#6f9bd1","#b08bd6","#d6c34e"];

  function loadHabits(){
    try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveHabits(){
    localStorage.setItem(STORE_KEY, JSON.stringify(state.habits));
  }
  function todayStr(d=new Date()){
    return d.toISOString().slice(0,10);
  }
  function daysAgo(n){
    const d = new Date(); d.setDate(d.getDate()-n); return d;
  }

  /* ---------------- state ---------------- */
  const state = {
    habits: loadHabits(),
    filter: "all",
    search: "",
    showArchived: false,
    editingId: null,
    detailId: null,
    selectedColor: COLORS[0],
    selectedFreq: [0,1,2,3,4,5,6],
    heatmapWeeks: 14,
    sortMode: "manual"
  };

  /* ---------------- helpers ---------------- */
  function uid(){ return Math.random().toString(36).slice(2,9); }

  function isScheduledToday(h, dateStr){
    const dow = new Date(dateStr+"T00:00:00").getDay();
    return h.freq.includes(dow);
  }

  function isDone(h, ds){
    const v = h.log[ds];
    if(v==="skip") return false;
    if(h.countTarget) return (Number(v)||0) >= Number(h.countTarget);
    return !!v;
  }
  function isSkipped(h, ds){ return h.log[ds]==="skip"; }

  function computeStreak(h){
    let streak = 0;
    let cursor = new Date();
    while(true){
      const ds = todayStr(cursor);
      const scheduled = isScheduledToday(h, ds);
      if(scheduled){
        if(isDone(h, ds)) { streak++; }
        else if(isSkipped(h, ds)) { /* skip day: passes through, doesn't add or break */ }
        else {
          if(ds === todayStr()) { /* today not done yet - don't break, don't count */ }
          else break;
        }
      }
      cursor.setDate(cursor.getDate()-1);
      if(streak > 0 && cursor < daysAgo(370)) break;
      if(cursor < daysAgo(370)) break;
    }
    return streak;
  }

  function bestStreak(h){
    const dates = Object.keys(h.log).filter(d=>isDone(h,d)).sort();
    if(!dates.length) return 0;
    let best=1, cur=1;
    for(let i=1;i<dates.length;i++){
      const prev = new Date(dates[i-1]); const curD = new Date(dates[i]);
      const diff = Math.round((curD-prev)/86400000);
      if(diff<=2){ cur++; } else { cur=1; } // tolerate skipped non-scheduled days loosely
      best = Math.max(best,cur);
    }
    return best;
  }

  function completionRate(h){
    let scheduled=0, done=0;
    for(let i=0;i<90;i++){
      const ds = todayStr(daysAgo(i));
      if(new Date(ds) > new Date()) continue;
      if(isScheduledToday(h, ds)){
        if(isSkipped(h,ds)) continue; // excused days don't count for or against
        scheduled++; if(isDone(h,ds)) done++;
      }
    }
    return scheduled ? Math.round((done/scheduled)*100) : 0;
  }

  function totalCompletions(h){
    return Object.keys(h.log).filter(d=>isDone(h,d)).length;
  }

  function adjustCount(id, delta){
    const h = findHabit(id); if(!h) return;
    const ds = todayStr();
    const wasDone = isDone(h, ds);
    const cur = Number(h.log[ds])||0;
    const next = Math.max(0, cur+delta);
    if(next===0) delete h.log[ds]; else h.log[ds] = next;
    saveHabits(); render();
    const nowDone = isDone(h, ds);
    if(!wasDone && nowDone){
      const streak = computeStreak(h);
      if([7,14,30,50,100].includes(streak) || (h.target && streak===Number(h.target))){
        fireConfetti(); showToast(`🔥 ${streak}-day streak on "${h.name}"`);
      } else showToast("Logged.");
    }
  }

  let activePopover = null;
  function closeNotePopover(){
    if(activePopover){ activePopover.remove(); activePopover = null; }
  }
  function openNotePopover(cellEl, habitId, ds){
    closeNotePopover();
    const h = findHabit(habitId); if(!h) return;
    const pop = document.createElement("div");
    pop.className = "note-popover";
    const existingNote = (h.notes && h.notes[ds]) || "";
    const skipped = isSkipped(h, ds);
    pop.innerHTML = `
      <div style="font-family:var(--mono);font-size:10.5px;color:var(--text-low);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;">${ds}</div>
      <textarea placeholder="Add a note for this day…">${escapeHTML(existingNote)}</textarea>
      <div class="row">
        <button class="skip-btn ${skipped?'on':''}" data-id="${habitId}" data-date="${ds}">${skipped?'✓ Skipped':'Mark as skipped'}</button>
        ${h.countTarget?'':`<button class="toggle-done-btn" data-id="${habitId}" data-date="${ds}">${isDone(h,ds)?'Unmark done':'Mark done'}</button>`}
      </div>
      <div class="row">
        <button class="close-pop">Close</button>
        <button class="save-note-btn" data-id="${habitId}" data-date="${ds}">Save note</button>
      </div>
    `;
    document.body.appendChild(pop);
    const rect = cellEl.getBoundingClientRect();
    pop.style.top = (window.scrollY + rect.bottom + 6) + "px";
    pop.style.left = Math.min(window.scrollX + rect.left, window.innerWidth-240) + "px";
    activePopover = pop;

    pop.querySelector(".close-pop").addEventListener("click", closeNotePopover);
    pop.querySelector(".save-note-btn").addEventListener("click", ()=>{
      const text = pop.querySelector("textarea").value.trim();
      if(!h.notes) h.notes = {};
      if(text) h.notes[ds] = text; else delete h.notes[ds];
      saveHabits(); render(); closeNotePopover();
      if(detailOverlay.classList.contains("open")) openDetail(habitId);
      showToast("Note saved.");
    });
    pop.querySelector(".skip-btn").addEventListener("click", ()=>{
      if(isSkipped(h,ds)) delete h.log[ds]; else h.log[ds] = "skip";
      saveHabits(); render(); closeNotePopover();
      if(detailOverlay.classList.contains("open")) openDetail(habitId);
    });
    pop.querySelector(".toggle-done-btn")?.addEventListener("click", ()=>{
      toggleDate(habitId, ds); closeNotePopover();
    });
    setTimeout(()=>{
      document.addEventListener("click", outsideClick);
    },10);
    function outsideClick(e){
      if(!pop.contains(e.target)){ closeNotePopover(); document.removeEventListener("click", outsideClick); }
    }

  let toastTimer;
  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove("show"), 2400);

  /* ---------------- rendering ---------------- */
  function render(){
    renderStrip();
    renderPills();
    renderHabits();
  }

  function renderStrip(){
    const active = state.habits.filter(h=>!h.archived);
    const today = todayStr();
    const dueToday = active.filter(h=>isScheduledToday(h,today));
    const doneToday = dueToday.filter(h=>h.log[today]);
    const longest = active.reduce((m,h)=>Math.max(m, computeStreak(h)),0);
    const avgRate = active.length ? Math.round(active.reduce((s,h)=>s+completionRate(h),0)/active.length) : 0;

    const el = document.getElementById("ledgerStrip");
    el.innerHTML = `
      <div class="ledger-cell flame">
        <span class="num">${longest}</span>
        <span class="lbl">Longest active streak</span>
      </div>
      <div class="ledger-cell">
        <span class="num">${doneToday.length}/${dueToday.length}</span>
        <span class="lbl">Done today</span>
      </div>
      <div class="ledger-cell moss">
        <span class="num">${avgRate}%</span>
        <span class="lbl">90-day consistency</span>
      </div>
      <div class="ledger-cell">
        <span class="num">${active.length}</span>
        <span class="lbl">Habits tracked</span>
      </div>
    `;
  }

  function renderPills(){
    const cats = ["all","health","mind","work","craft","other"];
    const el = document.getElementById("filterPills");
    el.innerHTML = cats.map(c=>`<button class="pill ${state.filter===c?'active':''}" data-cat="${c}">${c[0].toUpperCase()+c.slice(1)}</button>`).join("");
    el.querySelectorAll(".pill").forEach(p=>p.addEventListener("click",()=>{
      state.filter = p.dataset.cat; render();
    }));
  }

  function heatmapHTML(h, weeks=state.heatmapWeeks){
    const today = new Date();
    let cells = "";
    for(let i=weeks*7-1;i>=0;i--){
      const d = daysAgo(i);
      const ds = todayStr(d);
      const isToday = ds===todayStr();
      let level = 0;
      const skipped = isSkipped(h, ds);
      if(isDone(h,ds)) level = 3;
      else if(h.countTarget && Number(h.log[ds])>0) level = 1;
      const hasNote = h.notes && h.notes[ds];
      cells += `<div class="hm-cell ${isToday?'today':''} ${hasNote?'has-note':''}" data-level="${level}" ${skipped?'data-skip="1"':''} title="${ds}${isDone(h,ds)?' ✓':''}${skipped?' (skipped)':''}" data-habit="${h.id}" data-date="${ds}"></div>`;
    }
    return cells;
  }

  function sortHabits(habits){
    const mode = state.sortMode||"manual";
    const arr = habits.slice();
    if(mode==="streak") arr.sort((a,b)=>computeStreak(b)-computeStreak(a));
    else if(mode==="name") arr.sort((a,b)=>a.name.localeCompare(b.name));
    else if(mode==="created") arr.sort((a,b)=>(b.created||"").localeCompare(a.created||""));
    return arr;
  }

  function renderHabits(){
    const list = document.getElementById("habitsList");
    let habits = state.habits.filter(h=> state.showArchived ? true : !h.archived);
    if(state.filter!=="all") habits = habits.filter(h=>h.category===state.filter);
    if(state.search) habits = habits.filter(h=>h.name.toLowerCase().includes(state.search.toLowerCase()));
    habits = sortHabits(habits);

    if(!habits.length){
      list.innerHTML = `
        <div class="empty">
          <div class="glyph">✎</div>
          <h3>The page is blank</h3>
          <p>Start your ledger with one small, repeatable habit. Consistency is written one check mark at a time.</p>
        </div>`;
      return;
    }

    const today = todayStr();
    list.innerHTML = habits.map(h=>{
      const streak = computeStreak(h);
      const done = !!h.log[today];
      const scheduledToday = isScheduledToday(h, today);
      const catColors = {health:"#7fae8a",mind:"#6f9bd1",work:"#d99a4e",craft:"#b08bd6",other:"#d6c34e"};
      const curCount = Number(h.log[today])||0;
      const checkOrStepper = h.countTarget ? `
          <div class="count-stepper" data-id="${h.id}">
            <button data-action="dec" data-id="${h.id}" aria-label="Decrease">−</button>
            <span class="count-val">${curCount}/${h.countTarget}</span>
            <button data-action="inc" data-id="${h.id}" aria-label="Increase">＋</button>
          </div>` : `
          <button class="habit-check ${done?'done':''}" data-action="toggle" data-id="${h.id}" ${!scheduledToday?'style="opacity:.35"':''} aria-label="Mark ${h.name} done">${done?'✓':''}</button>`;
      return `
      <div class="habit ${h.archived?'archived':''}" data-id="${h.id}">
        <div class="habit-row">
          <span class="drag-handle" draggable="true" data-action="drag" data-id="${h.id}" title="Drag to reorder">⠿</span>
          ${checkOrStepper}
          <div class="habit-info" data-action="detail" data-id="${h.id}" style="cursor:pointer;">
            <div class="habit-name">
              <span style="width:8px;height:8px;border-radius:50%;background:${h.color};display:inline-block;"></span>
              ${escapeHTML(h.name)}
              <span class="habit-tag" style="background:${catColors[h.category]}22;color:${catColors[h.category]};">${h.category}</span>
            </div>
            <div class="habit-meta">${h.freq.length===7?'Every day':h.freq.map(d=>DAY_NAMES[d]).join(' ')} · ${totalCompletions(h)} total · ${completionRate(h)}% / 90d</div>
          </div>
          <div class="habit-streak"><span class="fire">${streak>0?'🔥':''}</span>${streak}</div>
          <div class="habit-controls">
            <button class="mini-btn" data-action="edit" data-id="${h.id}" title="Edit" aria-label="Edit habit">✎</button>
            <button class="mini-btn" data-action="archive" data-id="${h.id}" title="${h.archived?'Unarchive':'Archive'}" aria-label="Archive habit">${h.archived?'↺':'⌷'}</button>
          </div>
        </div>
        <div class="heatmap">${heatmapHTML(h)}</div>
      </div>`;
    }).join("");

    // bind
    list.querySelectorAll('[data-action="toggle"]').forEach(b=>b.addEventListener("click",e=>{
      e.stopPropagation(); toggleToday(b.dataset.id);
    }));
    list.querySelectorAll('[data-action="inc"]').forEach(b=>b.addEventListener("click",e=>{
      e.stopPropagation(); adjustCount(b.dataset.id, 1);
    }));
    list.querySelectorAll('[data-action="dec"]').forEach(b=>b.addEventListener("click",e=>{
      e.stopPropagation(); adjustCount(b.dataset.id, -1);
    }));
    list.querySelectorAll('[data-action="detail"]').forEach(b=>b.addEventListener("click",()=>openDetail(b.dataset.id)));
    list.querySelectorAll('[data-action="edit"]').forEach(b=>b.addEventListener("click",e=>{
      e.stopPropagation(); openEdit(b.dataset.id);
    }));
    list.querySelectorAll('[data-action="archive"]').forEach(b=>b.addEventListener("click",e=>{
      e.stopPropagation(); toggleArchive(b.dataset.id);
    }));
    list.querySelectorAll('.hm-cell').forEach(c=>c.addEventListener("click",e=>{
      e.stopPropagation();
      openNotePopover(c, c.dataset.habit, c.dataset.date);
    }));
    bindDragEvents(list);
  }

  function escapeHTML(s){
    const d = document.createElement("div"); d.textContent = s; return d.innerHTML;

  function toggleDate(id, ds){
    const h = findHabit(id); if(!h) return;
    const wasOn = !!h.log[ds];
    if(wasOn) delete h.log[ds]; else h.log[ds] = true;
    saveHabits();
    render();
    if(!wasOn){
      const streak = computeStreak(h);
      if(h.target && streak===Number(h.target)) { fireConfetti(); showToast(`🎉 "${h.name}" hit your ${h.target}-day goal!`); }
      else if([7,14,30,50,100].includes(streak)) { fireConfetti(); showToast(`🔥 ${streak}-day streak on "${h.name}"`); }
      else showToast("Logged.");
    }
  }

  function toggleArchive(id){
    const h = findHabit(id); if(!h) return;
    h.archived = !h.archived; saveHabits(); render();

  function deleteHabit(id){

  function saveHabitFromModal(){
    const name = document.getElementById("habitName").value.trim();
    if(!name){ showToast("Give your habit a name first."); return; }
    if(!state.selectedFreq.length){ showToast("Pick at least one day."); return; }
    const category = document.getElementById("habitCategory").value;
    const reminder = document.getElementById("habitReminder").value;
    const target = document.getElementById("habitTarget").value.replace(/\D/g,"");

    if(state.editingId){

    } else {
      state.habits.push({
        id: uid(), name, category, reminder, target, countTarget,
        color: state.selectedColor, freq: state.selectedFreq.slice(),
        log:{}, notes:{}, archived:false, created: todayStr()

      maybeScheduleNotification(reminder, name);

    saveHabits(); closeModal(); render();

  /* ---------------- confetti ---------------- */
  const confettiCanvas = document.getElementById("confettiCanvas");
  const cctx = confettiCanvas.getContext("2d");
  function resizeCanvas(){ confettiCanvas.width = innerWidth; confettiCanvas.height = innerHeight; }
  window.addEventListener("resize", resizeCanvas); resizeCanvas();

  function fireConfetti(){
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const colors = COLORS;
    const pieces = Array.from({length:90},()=>({
      x: innerWidth/2 + (Math.random()-0.5)*200,
      y: innerHeight*0.3,
      vx:(Math.random()-0.5)*9,
      vy: -Math.random()*9-3,
      g: 0.28,
      size: 4+Math.random()*5,
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*Math.PI,
      vr:(Math.random()-0.5)*0.3,
      life: 90+Math.random()*30
    }));
    let frame=0;
    function step(){
      cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
      let alive=false;
      pieces.forEach(p=>{
        if(p.life<=0) return;
        p.life--; alive = alive || p.life>0;
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        cctx.save();
        cctx.translate(p.x,p.y); cctx.rotate(p.rot);
        cctx.fillStyle = p.color;
        cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
        cctx.restore();
      });
      frame++;
      if(alive && frame<140) requestAnimationFrame(step);
      else cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    }
    step();
  }

  /* ---------------- drag reorder ---------------- */
  let dragId = null;
  function bindDragEvents(list){
    list.querySelectorAll(".habit").forEach(card=>{
      card.addEventListener("dragover", e=>{ e.preventDefault(); card.classList.add("drag-over"); });
      card.addEventListener("dragleave", ()=>card.classList.remove("drag-over"));
      card.addEventListener("drop", e=>{
        e.preventDefault(); card.classList.remove("drag-over");
        const targetId = card.dataset.id;
        if(!dragId || dragId===targetId) return;
        const from = state.habits.findIndex(h=>h.id===dragId);
        const to = state.habits.findIndex(h=>h.id===targetId);
        if(from<0||to<0) return;
        const [moved] = state.habits.splice(from,1);
        state.habits.splice(to,0,moved);
        saveHabits(); render();
      });
    });
    list.querySelectorAll('[data-action="drag"]').forEach(handle=>{
      handle.addEventListener("dragstart", e=>{
        dragId = handle.dataset.id;
        handle.closest(".habit").classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
      });
      handle.addEventListener("dragend", ()=>{
        document.querySelectorAll(".habit").forEach(c=>c.classList.remove("dragging","drag-over"));
        dragId = null;
      });
    });
  }

  /* ---------------- reminder notifications (real, checked every 30s) ---------------- */
  const notifiedToday = {};
  function checkReminders(){
    if(!("Notification" in window) || Notification.permission!=="granted") return;
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,"0");
    const mm = String(now.getMinutes()).padStart(2,"0");
    const nowStr = `${hh}:${mm}`;
    const today = todayStr();
    state.habits.forEach(h=>{
      if(h.archived || !h.reminder || h.log[today]) return;
      if(!isScheduledToday(h, today)) return;
      const key = h.id+"_"+today;
      if(h.reminder===nowStr && !notifiedToday[key]){
        notifiedToday[key] = true;
        new Notification("Ledger reminder", { body: `Time for: ${h.name}`, tag: key });
      }
    });
  }
  setInterval(checkReminders, 30000);

  /* ---------------- CSV export ---------------- */
  function exportCSV(){
    const allDates = new Set();
    state.habits.forEach(h=>Object.keys(h.log).forEach(d=>allDates.add(d)));
    const dates = Array.from(allDates).sort();
    let rows = ["habit,category,"+dates.join(",")];
    state.habits.forEach(h=>{
      rows.push(`"${h.name.replace(/"/g,'""')}",${h.category},`+dates.map(d=>h.log[d]?1:0).join(","));
    });
    const blob = new Blob([rows.join("\n")], {type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `ledger-export-${todayStr()}.csv`;
    a.click(); URL.revokeObjectURL(url);
  }


  function exportData(){
    const blob = new Blob([JSON.stringify(state.habits,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `ledger-export-${todayStr()}.json`;
    a.click(); URL.revokeObjectURL(url);
  }
  function importData(file){
    const reader = new FileReader();
    reader.onload = e=>{
      try{
        const data = JSON.parse(e.target.result);
        if(Array.isArray(data)){ state.habits = data; saveHabits(); render(); showToast("Imported."); }
        else showToast("That file doesn't look right.");
      }catch(err){ showToast("Couldn't read that file."); }
    };
    reader.readAsText(file);
  }

  });

  // footer data actions injected
  const footer = document.createElement("footer");
  footer.className = "bottom";
  footer.innerHTML = `
    <span>Stored privately in this browser. Nothing leaves your device.</span>
    <span class="data-actions">
      <button id="exportBtn">Export JSON</button>
      <button id="exportCsvBtn">Export CSV</button>
      <button id="importBtn">Import JSON</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </span>
  `;
  document.querySelector(".wrap").appendChild(footer);
  document.getElementById("exportBtn").addEventListener("click", exportData);
  document.getElementById("exportCsvBtn").addEventListener("click", exportCSV);
  document.getElementById("importBtn").addEventListener("click", ()=>document.getElementById("importFile").click());
  document.getElementById("importFile").addEventListener("change", e=>{
    if(e.target.files[0]) importData(e.target.files[0]);
  });

  // init theme
  applyTheme(localStorage.getItem(THEME_KEY) || "dark");

  // seed example habits on first run
  if(!state.habits.length){
    state.habits = [
      {id:uid(), name:"Drink water on waking", category:"health", color:COLORS[1], freq:[0,1,2,3,4,5,6], log:{}, archived:false, target:"21", reminder:"", created:todayStr()},
      {id:uid(), name:"Write 200 words", category:"craft", color:COLORS[3], freq:[1,2,3,4,5], log:{}, archived:false, target:"30", reminder:"", created:todayStr()}
    ];
    // backfill a little history so the heatmap isn't empty
    [0,1].forEach(idx=>{
      for(let i=1;i<=6;i++){ if(Math.random()>0.25) state.habits[idx].log[todayStr(daysAgo(i))] = true; }
    });
    saveHabits();
  }

  render();
})();
</script>
</body>
</html>
